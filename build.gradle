plugins {
    id 'application'
}

group = 'de.hsw.spieltag'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    runtimeOnly 'com.h2database:h2:2.3.232'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'de.hsw.spieltag.Main'
}

// Damit die Konsolenanwendung mit "gradlew run" Eingaben lesen kann
run {
    standardInput = System.in
}

test {
    useJUnitPlatform()
    // Gradle 9: Ohne Tests im Projekt scheitert der Build sonst mit "did not discover any tests".
    failOnNoDiscoveredTests = false
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// Reproduzierbare Messung: gradlew messung
tasks.register('messung', JavaExec) {
    group = 'verification'
    description = 'Misst das Speichern einer Aufstellung (einzeln gegen gesammelt)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.hsw.spieltag.messung.AufstellungMessung'
}